# Un solo origen: la cookie de sesión, la API y los WebSockets comparten http://localhost:8080.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 30m;

  # DNS interno de Docker: renovar la IP si se recrea el backend.
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 3s;
  set $dialo_backend http://backend:3000;

  location /api/ {
    proxy_pass $dialo_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass $dialo_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  # Rutas directas de React (/comunidades/3, /invitacion/abc…) devuelven la app.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|woff2?|svg|png|jpg|webp)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public";
  }
}
